name: Publish Scheduled Posts

on:
  schedule:
    # Every 15 minutes, conservative enough for scheduled posts without hammering production.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-publish-scheduled
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger protected scheduled publish endpoint
        run: |
          set -euo pipefail
          case "${PRODUCTION_BASE_URL:-}" in
            https://?*) ;;
            *)
              echo "PRODUCTION_BASE_URL must start with https://" >&2
              exit 1
              ;;
          esac
          if [ -z "${PUBLISH_SCHEDULED_CRON_SECRET:-}" ]; then
            echo "Missing CRON_SECRET or AI_NEWS_CRON_SECRET secret" >&2
            exit 1
          fi

          endpoint="${PRODUCTION_BASE_URL%/}/api/cron/publish-scheduled"
          echo "Triggering scheduled publish endpoint: ${endpoint}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --show-error --silent \
            --proto '=https' --tlsv1.2 --max-time 30 \
            --request POST \
            --output "$response_file" \
            -w '%{http_code}' \
            --header "Authorization: Bearer ${PUBLISH_SCHEDULED_CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "$endpoint")"
          body="$(cat "$response_file")"
          rm -f "$response_file"
          if [ "$http_status" != "200" ]; then
            echo "Scheduled publish endpoint returned unexpected HTTP ${http_status}" >&2
            exit 1
          fi
          RESPONSE_BODY="$body" node -e '
            let payload;
            try {
              payload = JSON.parse(process.env.RESPONSE_BODY || "");
            } catch {
              console.error("Scheduled publish endpoint returned invalid JSON payload");
              process.exit(1);
            }
            if (!payload || payload.success !== true) {
              console.error("Scheduled publish endpoint did not report success: true");
              process.exit(1);
            }
          '
          echo "$body"
        env:
          PUBLISH_SCHEDULED_CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.AI_NEWS_CRON_SECRET }}
