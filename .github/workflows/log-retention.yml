name: API Log Retention

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-log-retention
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}

jobs:
  retain:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run one protected log retention batch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          case "${PRODUCTION_BASE_URL:-}" in
            https://?*) ;;
            *)
              echo "PRODUCTION_BASE_URL must start with https://" >&2
              exit 1
              ;;
          esac
          if [ -z "${CRON_SECRET:-}" ]; then
            echo 'Log retention workflow configuration is incomplete' >&2
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            --proto '=https' --tlsv1.2 --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${PRODUCTION_BASE_URL%/}/api/cron/log-retention"
