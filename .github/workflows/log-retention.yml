name: API Log Retention

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-log-retention
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}

jobs:
  retain:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run one protected log retention batch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          case "${PRODUCTION_BASE_URL:-}" in
            https://?*) ;;
            *)
              echo "PRODUCTION_BASE_URL must start with https://" >&2
              exit 1
              ;;
          esac
          if [ -z "${CRON_SECRET:-}" ]; then
            echo 'Log retention workflow configuration is incomplete' >&2
            exit 1
          fi
          endpoint="${PRODUCTION_BASE_URL%/}/api/cron/log-retention"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --show-error --silent \
            --proto '=https' --tlsv1.2 --max-time 30 \
            --request POST \
            --output "$response_file" \
            -w '%{http_code}' \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            "$endpoint")"
          body="$(cat "$response_file")"
          rm -f "$response_file"
          if [ "$http_status" != "200" ]; then
            echo "Log retention endpoint returned unexpected HTTP ${http_status}" >&2
            exit 1
          fi
          RESPONSE_BODY="$body" node -e '
            let payload;
            try {
              payload = JSON.parse(process.env.RESPONSE_BODY || "");
            } catch {
              console.error("Log retention endpoint returned invalid JSON payload");
              process.exit(1);
            }
            if (!payload || payload.success !== true) {
              console.error("Log retention endpoint did not report success: true");
              process.exit(1);
            }
          '
          echo "$body"
