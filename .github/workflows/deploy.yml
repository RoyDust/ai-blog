name: Deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing release SHA to diagnose
        required: true
      environment:
        description: Deployment environment
        required: true
        default: production
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Diagnose configuration without exposing values
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$(printf '%q' "$DEPLOY_PATH")" "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          cd "$1/releases/$2"
          docker compose -f docker-compose.prod.yml run --rm --no-deps -T app node <<'NODE'
          const { parseWebReadinessConfig } = require('./.generated/web-health/web-readiness-config.js');
          const valid = { DATABASE_URL: 'postgresql://diagnostic:diagnostic@localhost/diagnostic', AUTH_SECRET: 'diagnostic-valid-auth-value', NEXTAUTH_SECRET: 'diagnostic-valid-nextauth-value', NEXTAUTH_URL: 'http://localhost:3000', NEXT_PUBLIC_SITE_URL: 'http://localhost:3000' };
          for (const key of Object.keys(valid)) {
            const value = process.env[key];
            const state = !value?.trim() ? 'missing' : parseWebReadinessConfig({ ...valid, [key]: value }).valid ? 'valid' : 'invalid';
            console.log('CONFIG ' + key + ': ' + state);
          }
          NODE
          docker ps --filter publish=3000 --format 'APP_CONTAINER {{.Names}} PROJECT {{.Label "com.docker.compose.project"}} SERVICE {{.Label "com.docker.compose.service"}} IMAGE {{.Image}} STATE {{.State}}'
          docker image inspect my-next-app:latest --format 'CANDIDATE_IMAGE {{.Id}}'
          REMOTE
