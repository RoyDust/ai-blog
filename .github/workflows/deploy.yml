name: Deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Previously uploaded release SHA
        required: true
      environment:
        description: Deployment environment
        required: true
        default: production
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 7454c5b3ee16a2b664203ff8a3e41b1bc7e5c910
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Recover verified release with production gates
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          RELEASE_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" == ab4de42b89b7665127d1707b16d017f699d0cee5 ]]
          [[ "$DEPLOY_COMPOSE_PROJECT_NAME" == current ]]
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp -P "$DEPLOY_PORT" scripts/prepare-production-env.cjs "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$RELEASE_SHA/scripts/prepare-production-env.cjs"
          scp -P "$DEPLOY_PORT" scripts/deploy/deploy-remote.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/$RELEASE_SHA/scripts/deploy/deploy-remote.sh"
          ssh -o ServerAliveInterval=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$(printf '%q' "$DEPLOY_PATH")" "$RELEASE_SHA" <<'REMOTE'
          set -euo pipefail
          base="$1"
          release="$2"
          cd "$base/releases/$release"
          image=$(docker image inspect 23195b98fcf88 --format '{{.Id}}')
          [[ $(docker image inspect my-next-app:latest --format '{{.Id}}') == "$image" ]]
          [[ $(docker inspect --format '{{.State.Running}}' current-app-1) == true ]]
          if [[ ! -f "$base/shared/.env.pre-$release" ]]; then
            install -m 600 "$base/shared/.env" "$base/shared/.env.pre-$release"
          fi
          docker run --rm --network none --entrypoint node --env DEPLOY_COMPOSE_PROJECT_NAME=current \
            --mount "type=bind,src=$base/releases/$release/scripts/prepare-production-env.cjs,dst=/app/scripts/prepare-production-env.cjs,readonly" \
            --mount "type=bind,src=$base/shared/.env,dst=/tmp/production.env" \
            "$image" /app/scripts/prepare-production-env.cjs /tmp/production.env
          docker tag "$image" "my-next-app:release-$release"
          PREBUILT_IMAGE_ID="$image" BACKUP_BEFORE_DEPLOY=1 RELEASE_SHA="$release" DEPLOY_PATH="$base" bash scripts/deploy/deploy-remote.sh
          echo "Production application release: $release"
          REMOTE
