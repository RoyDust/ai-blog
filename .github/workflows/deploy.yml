name: Deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release SHA
        required: true
      environment:
        description: Deployment environment
        required: true
        default: production
concurrency:
  group: deploy-transfer-diagnostic
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  inspect-transfer:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Inspect backup-client transfer without modifying production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$(printf '%q' "$DEPLOY_PATH")" <<'REMOTE'
          set -euo pipefail
          shopt -s nullglob
          for n in 1 2; do
            for file in "$1"/shared/postgres-*-recovery.tar.gz; do
              stat --printf 'TRANSFER %s bytes\n' "$file"
            done
            if [[ "$n" == 1 ]]; then sleep 10; fi
          done
          df --output=avail "$1" | tail -1 | awk '{ print "FREE_KIB " $1 }'
          docker ps --filter publish=3000 --format 'APP_STATE {{.State}}'
          docker images --format 'BACKUP_CLIENT {{.Repository}}:{{.Tag}}' --filter 'reference=postgres:*'
          REMOTE
