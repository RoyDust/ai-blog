name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
      environment:
        description: Deployment environment
        required: true
        default: production

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_next_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d my_next_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    environment:
      name: ${{ inputs.environment }}
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/my_next_app?schema=public
      AUTH_SECRET: test-auth-secret
      NEXTAUTH_SECRET: test-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      AUTH_GITHUB_ID: test-github-id
      AUTH_GITHUB_SECRET: test-github-secret
      QINIU_ACCESS_KEY: test-ak
      QINIU_SECRET_KEY: test-sk
      QINIU_BUCKET: test-bucket
      QINIU_DOMAIN: http://project.roydust.top
      QINIU_UPLOAD_URL: https://up-z2.qiniup.com
      DASHSCOPE_API_KEY: test-dashscope-key
      SSH_KEEPALIVE_OPTS: -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve checked-out commit SHA
        run: |
          RESOLVED_SHA="$(git rev-parse HEAD)"
          [[ "$RESOLVED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid resolved commit SHA" >&2; exit 1; }
          echo "RESOLVED_SHA=${RESOLVED_SHA}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply Prisma migrations for build database
        run: pnpm prisma migrate deploy

      - name: Build
        run: pnpm build

      - name: Write production env file locally
        # APP_ENV_FILE 须包含 OPERATION_LOG_INGEST_SECRET（缺配时被拒管理请求日志静默丢失）等内部密钥；
        # AI_NEWS_CRON_SECRET / CRON_SECRET 由下方 append 注入，避免手改 APP_ENV_FILE。
        # /api/cron/log-retention 只认 CRON_SECRET（middleware 精确路径注册表，不接受其他密钥代替）。
        # 详见 docs/deployment/security-hardening-runbook.md 第 1、5 节。
        env:
          RAW_APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          RAW_AI_NEWS_CRON_SECRET: ${{ secrets.AI_NEWS_CRON_SECRET }}
          RAW_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          umask 077
          printf '%s' "$RAW_APP_ENV_FILE" > app.env
          [ -z "$(tail -c 1 app.env)" ] || printf '\n' >> app.env
          node -e '
            const fs = require("node:fs");
            function serializeDotenvLiteral(name, raw) {
              const value = String(raw ?? "");
              if (/[\r\n]/.test(value)) {
                console.error(name + " must not contain newline characters");
                process.exit(1);
              }
              if (!value.includes("\x27")) {
                return name + "=\x27" + value + "\x27";
              }
              if (!value.includes("$")) {
                return name + "=" + JSON.stringify(value);
              }
              console.error(name + " cannot contain both single quotes and $");
              process.exit(1);
            }
            const lines = [
              serializeDotenvLiteral("AI_NEWS_CRON_SECRET", process.env.RAW_AI_NEWS_CRON_SECRET),
              serializeDotenvLiteral("CRON_SECRET", process.env.RAW_CRON_SECRET),
            ];
            fs.appendFileSync("app.env", lines.join("\n") + "\n", { mode: 0o600 });
          '
          chmod 600 app.env

      - name: Validate production configuration before image build
        env:
          DEPLOY_COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
        run: |
          node scripts/build-web-health.cjs
          node scripts/prepare-production-env.cjs app.env

      - name: Build production Docker image
        run: |
          set -euo pipefail
          install -m 600 app.env .env
          if [ -f scripts/deploy/read-dotenv.cjs ]; then
            exec 3< <(node scripts/deploy/read-dotenv.cjs app.env \
              NEXTAUTH_URL NEXT_PUBLIC_SITE_URL COMPOSE_PROJECT_NAME)
          else
            exec 3< <(node -e '
              const fs = require("node:fs");
              const { parse } = require("dotenv");
              const [file, ...keys] = process.argv.slice(1);
              const parsed = parse(fs.readFileSync(file, "utf8"));
              if (parsed.NEXTAUTH_SECRET === "${AUTH_SECRET}" && typeof parsed.AUTH_SECRET === "string") {
                parsed.NEXTAUTH_SECRET = parsed.AUTH_SECRET;
              }
              for (const key of keys) {
                if (Object.prototype.hasOwnProperty.call(parsed, key)) {
                  process.stdout.write(key + "\0" + String(parsed[key]) + "\0");
                }
              }
            ' app.env NEXTAUTH_URL NEXT_PUBLIC_SITE_URL COMPOSE_PROJECT_NAME)
          fi
          reader_pid=$!
          while IFS= read -r -d '' -u 3 env_key && IFS= read -r -d '' -u 3 env_val; do
            export "$env_key=$env_val"
          done
          exec 3<&-
          wait "$reader_pid"
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml build app
          docker save my-next-app:latest | gzip > my-next-app.tar.gz

      - name: Smoke test production image with database outage
        run: bash scripts/deploy/smoke-web-health.sh

      - name: Prepare release bundle
        run: |
          mkdir -p release
          rsync -a ./ release/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.next/' \
            --exclude '.worktrees/' \
            --exclude 'node_modules/' \
            --exclude 'docs/' \
            --exclude 'e2e/' \
            --exclude 'release/' \
            --exclude 'test-results/' \
            --exclude 'app.env' \
            --exclude 'my-next-app.tar.gz' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.development' \
            --exclude '.env.test'
          mv my-next-app.tar.gz release/my-next-app.tar.gz
          chmod +x release/scripts/deploy/deploy-remote.sh
          if [ -f release/scripts/deploy/backup-production.sh ]; then
            chmod +x release/scripts/deploy/backup-production.sh
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            echo "Missing DEPLOY_KNOWN_HOSTS secret" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create remote release directory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_PORT:-}" =~ ^[0-9]+$ ]] || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          [[ "${DEPLOY_PATH:-}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEPLOY_PATH" >&2; exit 1; }
          [[ -n "${DEPLOY_USER:-}" && -n "${DEPLOY_HOST:-}" ]] || { echo "Missing DEPLOY_USER or DEPLOY_HOST" >&2; exit 1; }
          ssh $SSH_KEEPALIVE_OPTS -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") RESOLVED_SHA=$(printf '%q' "$RESOLVED_SHA") bash -s" <<'EOF'
          set -euo pipefail
          mkdir -p "${DEPLOY_PATH}/releases/${RESOLVED_SHA}" "${DEPLOY_PATH}/shared"
          EOF

      - name: Upload release bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_PORT:-}" =~ ^[0-9]+$ ]] || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          [[ "${DEPLOY_PATH:-}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEPLOY_PATH" >&2; exit 1; }
          rsync -az --delete -e "ssh $SSH_KEEPALIVE_OPTS -p $DEPLOY_PORT" \
            release/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/releases/${RESOLVED_SHA}/"

      - name: Upload production env file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_PORT:-}" =~ ^[0-9]+$ ]] || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          [[ "${DEPLOY_PATH:-}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEPLOY_PATH" >&2; exit 1; }
          chmod 600 app.env
          scp $SSH_KEEPALIVE_OPTS -P "$DEPLOY_PORT" app.env "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/releases/${RESOLVED_SHA}/.env"

      - name: Activate release and restart services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_PORT:-}" =~ ^[0-9]+$ ]] || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          [[ "${DEPLOY_PATH:-}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEPLOY_PATH" >&2; exit 1; }
          ssh $SSH_KEEPALIVE_OPTS -p "$DEPLOY_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") RESOLVED_SHA=$(printf '%q' "$RESOLVED_SHA") bash -s" <<'EOF'
          set -euo pipefail
          release_dir="${DEPLOY_PATH}/releases/${RESOLVED_SHA}"
          chmod 600 "${release_dir}/.env"
          cd "${release_dir}"
          chmod +x scripts/deploy/deploy-remote.sh
          if [ -f scripts/deploy/backup-production.sh ]; then
            chmod +x scripts/deploy/backup-production.sh
          fi
          BACKUP_BEFORE_DEPLOY=1 RELEASE_SHA="${RESOLVED_SHA}" DEPLOY_PATH="${DEPLOY_PATH}" RELEASE_DIR="${release_dir}" bash scripts/deploy/deploy-remote.sh
          if [ -L "${DEPLOY_PATH}/current/.env" ] && [ -f "${DEPLOY_PATH}/shared/.env" ] && [ ! "${DEPLOY_PATH}/current" -ef "${release_dir}" ]; then
            prev_env_tmp="${DEPLOY_PATH}/current/.env.snapshot.$$"
            install -m 600 "${DEPLOY_PATH}/shared/.env" "${prev_env_tmp}"
            mv -f "${prev_env_tmp}" "${DEPLOY_PATH}/current/.env"
          fi
          install -m 600 "${release_dir}/.env" "${DEPLOY_PATH}/shared/.env"
          ln -sfn "${DEPLOY_PATH}/releases/${RESOLVED_SHA}" "${DEPLOY_PATH}/current"
          EOF

      - name: Deployment summary
        env:
          DEPLOY_REF: ${{ inputs.ref }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          printf 'Deployed ref: %s\n' "$DEPLOY_REF"
          printf 'Release SHA: %s\n' "$RESOLVED_SHA"
          printf 'Target host: %s\n' "$DEPLOY_HOST"
